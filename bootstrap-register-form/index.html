<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>[Bài tập] Thiết kế Trang Đăng Ký với Bootstrap Forms</title>
    <!-- Nhúng Bootstrap 5.3.0 CSS từ CDN -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style>
        body {
            background-color: #f1f5f9;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 15px;
        }
        .register-card {
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.08);
            border: 1px solid #e2e8f0;
            overflow: hidden;
            max-width: 620px;
            width: 100%;
        }
        .card-header-custom {
            background: linear-gradient(135deg, #0d6efd, #0b5ed7);
            color: #ffffff;
            padding: 30px 20px;
            text-align: center;
        }
        .btn-register {
            padding: 12px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 8px;
        }
    </style>
</head>
<body>
    <div class="register-card">
        <!-- HEADER FORM -->
        <div class="card-header-custom">
            <h2 class="h3 fw-bold mb-1">Tạo Tài Khoản Mới</h2>
            <p class="mb-0 opacity-75 small">Tham gia cùng chúng tôi chỉ với vài bước đơn giản</p>
        </div>

        <!-- BODY FORM ĐĂNG KÝ -->
        <div class="card-body p-4 p-md-5">
            <form action="#" method="POST" id="registerForm">
                <!-- 1. Họ và tên (Input) -->
                <div class="mb-3">
                    <label for="fullName" class="form-label fw-semibold">Họ và tên <span class="text-danger">*</span></label>
                    <input type="text" class="form-control" id="fullName" placeholder="Ví dụ: Nguyễn Văn A" required>
                    <div class="form-text text-muted">Vui lòng nhập đầy đủ họ và tên thật của bạn.</div>
                </div>

                <!-- 2. Email (Input) -->
                <div class="mb-3">
                    <label for="email" class="form-label fw-semibold">Địa chỉ Email <span class="text-danger">*</span></label>
                    <input type="email" class="form-control" id="email" placeholder="name@example.com" required>
                    <div class="form-text text-muted">Chúng tôi cam kết không chia sẻ email của bạn cho bất kỳ ai.</div>
                </div>

                <!-- 3 & 4. Mật khẩu & Xác nhận mật khẩu (Password Input) -->
                <div class="row g-3 mb-3">
                    <div class="col-12 col-md-6">
                        <label for="password" class="form-label fw-semibold">Mật khẩu <span class="text-danger">*</span></label>
                        <input type="password" class="form-control" id="password" placeholder="Tối thiểu 8 ký tự" required>
                    </div>
                    <div class="col-12 col-md-6">
                        <label for="confirmPassword" class="form-label fw-semibold">Xác nhận mật khẩu <span class="text-danger">*</span></label>
                        <input type="password" class="form-control" id="confirmPassword" placeholder="Nhập lại mật khẩu" required>
                    </div>
                </div>

                <!-- 5. Giới tính (Radio button) -->
                <div class="mb-3">
                    <label class="form-label fw-semibold d-block">Giới tính <span class="text-danger">*</span></label>
                    <div class="form-check form-check-inline">
                        <input class="form-check-input" type="radio" name="gender" id="genderMale" value="male" checked>
                        <label class="form-check-label" for="genderMale">Nam</label>
                    </div>
                    <div class="form-check form-check-inline">
                        <input class="form-check-input" type="radio" name="gender" id="genderFemale" value="female">
                        <label class="form-check-label" for="genderFemale">Nữ</label>
                    </div>
                    <div class="form-check form-check-inline">
                        <input class="form-check-input" type="radio" name="gender" id="genderOther" value="other">
                        <label class="form-check-label" for="genderOther">Khác</label>
                    </div>
                </div>

                <!-- 6. Sở thích (Checkbox) -->
                <div class="mb-3">
                    <label class="form-label fw-semibold d-block">Sở thích</label>
                    <div class="form-check form-check-inline">
                        <input class="form-check-input" type="checkbox" id="hobbyCoding" value="coding" checked>
                        <label class="form-check-label" for="hobbyCoding">Lập trình Web</label>
                    </div>
                    <div class="form-check form-check-inline">
                        <input class="form-check-input" type="checkbox" id="hobbyReading" value="reading">
                        <label class="form-check-label" for="hobbyReading">Đọc sách</label>
                    </div>
                    <div class="form-check form-check-inline">
                        <input class="form-check-input" type="checkbox" id="hobbyGaming" value="gaming">
                        <label class="form-check-label" for="hobbyGaming">Chơi game</label>
                    </div>
                    <div class="form-check form-check-inline">
                        <input class="form-check-input" type="checkbox" id="hobbyMusic" value="music">
                        <label class="form-check-label" for="hobbyMusic">Âm nhạc</label>
                    </div>
                </div>

                <!-- 7. Quốc gia (Dropdown Select) -->
                <div class="mb-4">
                    <label for="country" class="form-label fw-semibold">Quốc gia <span class="text-danger">*</span></label>
                    <select class="form-select" id="country" required>
                        <option value="" disabled>-- Chọn quốc gia của bạn --</option>
                        <option value="vn" selected>Việt Nam</option>
                        <option value="us">Hoa Kỳ (United States)</option>
                        <option value="jp">Nhật Bản (Japan)</option>
                        <option value="kr">Hàn Quốc (Korea)</option>
                        <option value="sg">Singapore</option>
                    </select>
                </div>

                <!-- Điều khoản điều kiện -->
                <div class="form-check mb-4">
                    <input class="form-check-input" type="checkbox" id="termsCheck" required>
                    <label class="form-check-label small text-muted" for="termsCheck">
                        Tôi đồng ý với <a href="#" class="text-decoration-none">Điều khoản dịch vụ</a> và <a href="#" class="text-decoration-none">Chính sách bảo mật</a>.
                    </label>
                </div>

                <!-- 8. Nút Submit (btn-primary) -->
                <div class="d-grid mb-3">
                    <button type="submit" class="btn btn-primary btn-register shadow-sm">
                        Đăng Ký Tài Khoản
                    </button>
                </div>

                <p class="text-center text-muted small mb-0">
                    Đã có tài khoản? <a href="#" class="text-primary text-decoration-none fw-semibold">Đăng nhập tại đây</a>
                </p>
            </form>
        </div>
    </div>

    <!-- Nhúng Bootstrap JavaScript Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
